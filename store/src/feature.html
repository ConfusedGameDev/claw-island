<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('../../public/site/fonts/fredoka-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url('../../public/site/fonts/fredoka-latin-600-normal.woff2') format('woff2'); }
  html, body { margin: 0; overflow: hidden; }
  /* Google Play feature graphic: 1024 x 500, the logo on the left, the claw and pumpkin on the right. */
  .fg {
    position: relative; width: 1024px; height: 500px; overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: #1d1030 var(--scene) center / cover no-repeat;
  }
  .fg::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(29, 16, 48, 0.92) 0%, rgba(29, 16, 48, 0.7) 45%, rgba(29, 16, 48, 0.15) 75%, rgba(29, 16, 48, 0.35) 100%);
  }
  .logo { position: absolute; left: 64px; top: 50%; transform: translateY(-54%); display: flex; flex-direction: column; line-height: 0.88; font-weight: 700; }
  .logo span {
    font-size: 132px; color: #ff8a3c;
    -webkit-text-stroke: 8px #2a2230; paint-order: stroke fill; text-shadow: 0 9px 0 #2a2230;
  }
  .logo span:last-child { color: #b48cff; transform: rotate(-3deg); }
  .tag { position: absolute; left: 70px; bottom: 46px; font-size: 30px; font-weight: 600; color: #fff7e6; text-shadow: 0 3px 0 #2a2230; }
  .art { position: absolute; right: 30px; top: 50%; width: 460px; height: 460px; transform: translateY(-50%) rotate(4deg); }
</style>
</head>
<body>
<div class="fg" id="fg">
  <div class="logo"><span>Claw</span><span>Island</span></div>
  <div class="tag">Build a monster, one claw at a time</div>
  <img class="art" id="art" />
</div>
<script>
  window.layout = ({ scene, art }) => new Promise((resolve) => {
    document.getElementById('fg').style.setProperty('--scene', `url('${scene}')`);
    const img = document.getElementById('art');
    img.onload = () => document.fonts.ready.then(() => requestAnimationFrame(() => resolve()));
    img.src = art;
  });
</script>
</body>
</html>
